<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>sskin</title>

  <style>
    /* ================================================
       RESET
       ================================================ */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ================================================
       PAGE
       ================================================ */

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: none;
    }


    /* ================================================
       CANVAS CONTAINER
       ================================================ */

    #wrap {
      position: fixed;
      inset: 50px;
      background: #000;
    }


    #cv {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      /*
       * Wichtig:
       * NICHT pixelated verwenden.
       *
       * Das Canvas wird intern mit der
       * echten Displayauflösung gerendert.
       */
      image-rendering: auto;
    }


    /* ================================================
       MOBILE
       ================================================ */

    @media (max-width: 600px) {

      #wrap {
        inset: 20px;
      }

    }
  </style>
</head>


<body>

  <div id="wrap">
    <canvas id="cv"></canvas>
  </div>


  <script>
    (() => {

      // ==================================================
      // CANVAS
      // ==================================================

      const cv =
        document.getElementById('cv');

      const ctx =
        cv.getContext('2d', {
          alpha: false
        });


      // ==================================================
      // GRID
      // ==================================================

      const COLS = 9;
      const ROWS = 9;


      /*
       * Abstand zwischen den Punkten.
       *
       * Desktop:
       * 56px
       *
       * Mobile:
       * 38px
       */

      const DESKTOP_SPACING = 56;
      const MOBILE_SPACING = 38;


      // ==================================================
      // POINT SIZE
      // ==================================================

      /*
       * Grundgröße.
       *
       * Die Punkte bleiben außerhalb des
       * Cursor-Bereichs sehr klein und scharf.
       */

      const BASE_R = 3.2;


      /*
       * Maximale Größe direkt beim Cursor.
       */

      const MAX_R = 18;


      /*
       * Radius des lokalen Vergrößerungseffekts.
       *
       * Je kleiner der Wert,
       * desto konzentrierter der Effekt.
       */

      const POINTER_RADIUS = 125;


      // ==================================================
      // MOVEMENT
      // ==================================================

      /*
       * Federstärke.
       */

      const SPRING_K = 0.09;


      /*
       * Dämpfung.
       */

      const DAMP = 0.78;


      /*
       * Radius des Bewegungsbereichs.
       */

      const GRAVITY_R = 145;


      /*
       * Wie stark die Punkte zum Cursor
       * gezogen werden.
       */

      const GRAVITY_MAX = 25;


      // ==================================================
      // WAVE
      // ==================================================

      const ROW_DELAY = 0.055;

      const BOUNCE_AMP = 10;

      const DECAY = 4.2;

      const FREQ = 13.0;

      const COL_SPREAD = 0.65;


      // ==================================================
      // BLENDING
      // ==================================================

      /*
       * Blur nur für die großen Punkte.
       *
       * Dadurch bleiben die kleinen Punkte
       * gestochen scharf.
       */

      const BLUR_AMOUNT = 5;


      /*
       * Der scharfe Kern der großen Punkte.
       *
       * 0.72 bedeutet:
       *
       * 72% des Radius werden nochmals
       * scharf gezeichnet.
       */

      const CORE_SIZE = 0.72;


      // ==================================================
      // STATE
      // ==================================================

      let W = 0;
      let H = 0;

      let DPR = 1;

      let SPACING =
        DESKTOP_SPACING;

      let dots = [];

      let t = 0;

      let lastTime =
        performance.now();

      let drops = [];

      let nextDropAt = 0.6;


      // ==================================================
      // POINTER
      // ==================================================

      const pointer = {

        x: -9999,

        y: -9999,

        active: false

      };


      // ==================================================
      // RESIZE
      // ==================================================

      function resize() {

        const rect =
          cv.getBoundingClientRect();


        W = rect.width;
        H = rect.height;


        /*
         * High-DPI / Retina Rendering.
         *
         * Auf einem Retina-Display kann DPR
         * beispielsweise 2 oder 3 sein.
         *
         * Dadurch wird das Canvas intern
         * deutlich höher aufgelöst gerendert.
         */

        DPR =
          Math.min(
            window.devicePixelRatio || 1,
            3
          );


        cv.width =
          Math.round(
            W * DPR
          );


        cv.height =
          Math.round(
            H * DPR
          );


        /*
         * Wir arbeiten weiterhin mit
         * normalen CSS-Pixel-Koordinaten.
         */

        ctx.setTransform(
          DPR,
          0,
          0,
          DPR,
          0,
          0
        );


        /*
         * Auf Mobile engeres Raster.
         */

        SPACING =
          W <= 600
            ? MOBILE_SPACING
            : DESKTOP_SPACING;


        buildGrid();
      }


      // ==================================================
      // BUILD GRID
      // ==================================================

      function buildGrid() {

        const ox =
          (
            W -
            (COLS - 1) *
            SPACING
          ) / 2;


        const oy =
          (
            H -
            (ROWS - 1) *
            SPACING
          ) / 2;


        dots = [];


        for (
          let row = 0;
          row < ROWS;
          row++
        ) {

          for (
            let col = 0;
            col < COLS;
            col++
          ) {

            const bx =
              ox +
              col * SPACING;


            const by =
              oy +
              row * SPACING;


            dots.push({

              /*
               * Ursprungsposition
               */

              bx,
              by,


              /*
               * Aktuelle Position
               */

              x: bx,
              y: by,


              /*
               * Geschwindigkeit
               */

              vx: 0,
              vy: 0,


              /*
               * Aktueller Radius
               */

              r: BASE_R,


              /*
               * Grid Position
               */

              col,
              row

            });

          }

        }

      }


      // ==================================================
      // CREATE WAVE
      // ==================================================

      function spawnDrop() {

        drops.push({

          /*
           * Zufällige Spalte
           */

          col:
            Math.floor(
              Math.random() *
              COLS
            ),


          /*
           * Startzeit
           */

          time: t,


          /*
           * leicht zufällige Stärke
           */

          amp:
            BOUNCE_AMP *
            (
              0.7 +
              Math.random() *
              0.55
            )

        });


        /*
         * Nächste Welle
         */

        nextDropAt =
          t +
          1.8 +
          Math.random() *
          2.4;
      }


      // ==================================================
      // UPDATE
      // ==================================================

      function update(delta) {

        /*
         * Framerate-unabhängige Zeit.
         */

        const dt =
          Math.min(
            delta,
            32
          ) / 16.6667;


        t +=
          0.016 *
          dt;


        // ----------------------------------------------
        // AUTOMATIC WAVE
        // ----------------------------------------------

        if (
          t >=
          nextDropAt
        ) {

          spawnDrop();

        }


        /*
         * Alte Wellen entfernen.
         */

        drops =
          drops.filter(
            drop =>
              (
                t -
                drop.time
              ) < 2.5
          );


        // ----------------------------------------------
        // UPDATE DOTS
        // ----------------------------------------------

        for (
          const dot of dots
        ) {

          /*
           * Zielposition.
           */

          let tx =
            dot.bx;


          let ty =
            dot.by;


          /*
           * Standardmäßig kleiner Punkt.
           */

          let targetRadius =
            BASE_R;


          // ============================================
          // WAVE
          // ============================================

          for (
            const drop of drops
          ) {

            const localT =
              (
                t -
                drop.time
              ) -
              dot.row *
              ROW_DELAY;


            if (
              localT <= 0
            ) {

              continue;

            }


            const colDist =
              Math.abs(
                dot.col -
                drop.col
              );


            const lateral =
              Math.exp(
                -(
                  colDist ** 2
                ) *
                COL_SPREAD
              );


            if (
              lateral <
              0.01
            ) {

              continue;

            }


            ty +=

              drop.amp *

              Math.exp(
                -DECAY *
                localT
              ) *

              Math.sin(
                FREQ *
                localT
              ) *

              lateral;

          }


          // ============================================
          // POINTER
          // ============================================

          if (
            pointer.active
          ) {

            const dx =
              pointer.x -
              dot.bx;


            const dy =
              pointer.y -
              dot.by;


            const distance =
              Math.hypot(
                dx,
                dy
              );


            if (
              distance <
              POINTER_RADIUS
            ) {

              /*
               * Normale Influence.
               */

              const influence =
                Math.max(
                  0,
                  1 -
                  distance /
                  POINTER_RADIUS
                );


              /*
               * Cubic Falloff.
               *
               * Dadurch entsteht ein
               * relativ kleiner, konzentrierter
               * Bereich.
               */

              const strength =
                influence *
                influence *
                influence;


              // ----------------------------------------
              // POINT SIZE
              // ----------------------------------------

              targetRadius =

                BASE_R +

                (
                  MAX_R -
                  BASE_R
                ) *
                strength;


              // ----------------------------------------
              // MOVEMENT
              // ----------------------------------------

              if (
                distance >
                0.001
              ) {

                const movement =
                  strength *
                  GRAVITY_MAX;


                tx +=
                  (
                    dx /
                    distance
                  ) *
                  movement;


                ty +=
                  (
                    dy /
                    distance
                  ) *
                  movement;

              }

            }

          }


          // ============================================
          // SPRING
          // ============================================

          dot.vx +=

            (
              tx -
              dot.x
            ) *

            SPRING_K *

            dt;


          dot.vy +=

            (
              ty -
              dot.y
            ) *

            SPRING_K *

            dt;


          // ============================================
          // DAMPING
          // ============================================

          dot.vx *=
            Math.pow(
              DAMP,
              dt
            );


          dot.vy *=
            Math.pow(
              DAMP,
              dt
            );


          // ============================================
          // POSITION
          // ============================================

          dot.x +=
            dot.vx *
            dt;


          dot.y +=
            dot.vy *
            dt;


          // ============================================
          // RADIUS SMOOTHING
          // ============================================

          dot.r +=

            (
              targetRadius -
              dot.r
            ) *

            0.16 *

            dt;

        }

      }


      // ==================================================
      // DRAW
      // ==================================================

      function draw() {

        // ----------------------------------------------
        // BACKGROUND
        // ----------------------------------------------

        ctx.fillStyle =
          '#000';


        ctx.fillRect(
          0,
          0,
          W,
          H
        );


        // ----------------------------------------------
        // SMALL SHARP POINTS
        // ----------------------------------------------

        ctx.fillStyle =
          '#fff';


        for (
          const dot of dots
        ) {

          /*
           * Kleine Punkte werden komplett
           * ohne Blur gezeichnet.
           */

          if (
            dot.r <
            BASE_R + 1
          ) {

            ctx.beginPath();


            ctx.arc(
              dot.x,
              dot.y,
              dot.r,
              0,
              Math.PI * 2
            );


            ctx.fill();

          }

        }


        // ----------------------------------------------
        // LARGE BLENDED POINTS
        // ----------------------------------------------

        ctx.save();


        /*
         * Nur die großen Punkte bekommen
         * einen Blur.
         *
         * Dadurch können benachbarte Punkte
         * optisch miteinander verschmelzen.
         */

        ctx.filter =
          `blur(${BLUR_AMOUNT}px)`;


        ctx.fillStyle =
          '#fff';


        for (
          const dot of dots
        ) {

          if (
            dot.r >=
            BASE_R + 1
          ) {

            ctx.beginPath();


            ctx.arc(
              dot.x,
              dot.y,
              dot.r,
              0,
              Math.PI * 2
            );


            ctx.fill();

          }

        }


        ctx.restore();


        // ----------------------------------------------
        // SHARP CORE
        // ----------------------------------------------

        /*
         * Nach dem Blur zeichnen wir einen
         * scharfen Kern über die großen Punkte.
         *
         * So bekommt man gleichzeitig:
         *
         * - weiche Verbindung
         * - scharfen Mittelpunkt
         */

        ctx.fillStyle =
          '#fff';


        for (
          const dot of dots
        ) {

          if (
            dot.r >=
            BASE_R + 1
          ) {

            const core =
              dot.r *
              CORE_SIZE;


            ctx.beginPath();


            ctx.arc(
              dot.x,
              dot.y,
              core,
              0,
              Math.PI * 2
            );


            ctx.fill();

          }

        }

      }


      // ==================================================
      // POINTER POSITION
      // ==================================================

      function setPointer(
        clientX,
        clientY
      ) {

        const rect =
          cv.getBoundingClientRect();


        pointer.x =
          clientX -
          rect.left;


        pointer.y =
          clientY -
          rect.top;


        pointer.active =
          true;
      }


      // ==================================================
      // MOUSE
      // ==================================================

      window.addEventListener(
        'mousemove',
        event => {

          setPointer(
            event.clientX,
            event.clientY
          );

        },
        {
          passive: true
        }
      );


      window.addEventListener(
        'mouseleave',
        () => {

          pointer.active =
            false;

        }
      );


      // ==================================================
      // TOUCH
      // ==================================================

      window.addEventListener(
        'touchstart',
        event => {

          if (
            event.touches.length >
            0
          ) {

            setPointer(
              event.touches[0].clientX,
              event.touches[0].clientY
            );

          }

        },
        {
          passive: true
        }
      );


      window.addEventListener(
        'touchmove',
        event => {

          if (
            event.touches.length >
            0
          ) {

            setPointer(
              event.touches[0].clientX,
              event.touches[0].clientY
            );

          }

        },
        {
          passive: true
        }
      );


      window.addEventListener(
        'touchend',
        () => {

          pointer.active =
            false;

        },
        {
          passive: true
        }
      );


      // ==================================================
      // RESIZE
      // ==================================================

      window.addEventListener(
        'resize',
        resize
      );


      window.addEventListener(
        'orientationchange',
        () => {

          setTimeout(
            resize,
            100
          );

        }
      );


      // ==================================================
      // START
      // ==================================================

      resize();


      // ==================================================
      // ANIMATION LOOP
      // ==================================================

      function animate(now) {

        const delta =
          now -
          lastTime;


        lastTime =
          now;


        update(delta);

        draw();


        requestAnimationFrame(
          animate
        );

      }


      requestAnimationFrame(
        animate
      );

    })();
  </script>

</body>
</html>
